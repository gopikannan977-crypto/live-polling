version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pulsepoll-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pulsepoll-network

  redis:
    image: redis:7.2-alpine
    container_name: pulsepoll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pulsepoll-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsepoll-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/pulsepoll
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=pulsepoll-docker-production-super-secret-jwt-key
      - FRONTEND_URL=http://localhost:3000
      - ENV=production
    depends_on:
      - mongodb
      - redis
    networks:
      - pulsepoll-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pulsepoll-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - pulsepoll-network

volumes:
  mongo_data:
  redis_data:

networks:
  pulsepoll-network:
    driver: bridge
